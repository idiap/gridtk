# Hooks are run with prek (https://prek.j178.dev): `pixi run qa` checks every file,
# `pixi run qa-install` installs the git hooks.

default_install_hook_types: ["pre-commit", "commit-msg"]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: pixi run -e qa ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: pixi-lock
        name: check outdated pixi.lock
        entry: pixi lock --check
        language: system
        files: ^(pyproject\.toml|pixi\.lock)$
        pass_filenames: false
  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
